services:
  ci:
    build:
      context: ..
      dockerfile: ci.Dockerfile
    user: "${BUILDKITE_AGENT_UID:-1000}:${BUILDKITE_AGENT_GID:-1000}"
    working_dir: /workdir
    environment:
      HOME: /home/ci
      USER: ci
      PYTHONDONTWRITEBYTECODE: "1"
      BUILD_BUDDY_SECRET:
    volumes:
      - ..:/workdir
      - /var/lib/buildkite-agent/.cache:/home/ci/.cache
