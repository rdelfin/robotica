steps:
  - label: ":python: Compute the pipeline with Python"
    commands:
      - set -o pipefail; python3 .buildkite/pipeline.py | buildkite-agent pipeline upload
    plugins:
      - docker#v5.12.0:
          image: ghcr.io/rdelfin/robotica-ci:latest
          mount-buildkite-agent: true
          volumes:
            - /var/lib/buildkite-agent/.cache/bazel:/root/.cache/bazel
