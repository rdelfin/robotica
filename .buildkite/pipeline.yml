steps:
  - label: ":bazel: Build"
    commands:
      - echo "common --remote_header=x-buildbuddy-api-key=$$BUILD_BUDDY_SECRET" > user.bazelrc
      - echo "common --build_metadata=ROLE=CI" >> user.bazelrc
      - bazel build //...
    plugins:
      - docker-compose#v5.5.0:
          config: .buildkite/docker-compose.yml
          run: ci
          mount-buildkite-agent: true
