[package]
name = "robotica-foxglove"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.96", features = ["backtrace"] }
clap = { version = "4.5.31", features = ["derive"] }
foxglove = "0.2.1"
futures = "0.3.31"
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde", "text-format"] }
robotica = { version = "0.1", path = ".." }
serde = { version = "1.0.218", features = ["derive"] }
tokio = "1.43"
toml = "0.8.20"
