[workspace]
members = [
    "robotica-types",
    "robotica-cli",
    "robotica-foxglove",
]

[workspace.dependencies]
anyhow = "1"
prost = "0.14"
prost-build = "0.14"
prost-reflect = "0.16"
prost-reflect-build = "0.16"
prost-types = "0.14"
thiserror = "1"
log = "0.4"
tokio = "1.49"

[package]
name = "robotica"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1.11"
flume = "0.11"
futures = "0.3"
prost = { workspace = true }
prost-types = { workspace = true }
thiserror = { workspace = true }
zenoh = "1.7"
robotica-types = { version = "0.1", path = "robotica-types" }
prost-reflect = { workspace = true, features = ["serde", "text-format"] }
serde_json = "1.0"
tracing = { version = "0.1", features = ["log-always"] }
simple_logger = "5.1"
log = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = "0.4"
tokio = { workspace = true }
